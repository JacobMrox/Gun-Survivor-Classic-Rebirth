[Graphics]
FPSLimit=60
ForceWidth=1920
ForceHeight=1080
DisplayFPSCounter=1
FullScreenRefreshRateInHz=60
[Window]
ForceWindowedMode=1
BorderlessFullscreen=1
CenterWindow=1
AlwaysOnTop=0
LockCursorToWindow=1
UsePrimaryMonitor=0
KeepAspectRatio=0
[Fixes]
SkipMovies=0
Direct3D8DisableMaximizedWindowedModeShim=0
SmoothModelLighting=1
LethalZombieHeadshots=1
UncensoredHeadshots=1
BloodColor=255,0,0
ItemApproachPrompt=1
Hide2DShadows=0
DynamicModelShadows=1
Ps1ShootFlash=0
Ps1ShootFlashFrames=2
Ps1DoorFade=1
[Crosshair]
MouseSensitivity=2.000000
TexturePath=FIXRES/crosshair_uc_big.png
Scale=100
LaserTrail=1
LaserColor=255,0,0
[Application]
EnableLogging=0
ShowConfigOnLaunch=1
[Gamepad]
AimSpeed=20
AimInvertY=0

; A is the game's Enter (confirm). The fire button is a mouse click: the game's own action key
; also confirms, so a key binding would fire on every menu confirm.
A=Return
B=Escape
X=Space
Y=Tab
LB=LeftShift
RB=LeftClick
LT=LeftAlt
RT=RightControl

; spare buttons, no game key needed
Start=Return
Back=F1
L3=DebugMenu
R3=QuickSave

; movement
DpadUp=Up
DpadDown=Down
DpadLeft=Left
DpadRight=Right
StickUp=Up
StickDown=Down
StickLeft=Left
StickRight=Right

[SurvivorFix]
; Hidden switch (the configuration window never shows it): 1 gives F2/F10 and the pad's
; DebugMenu button (L3 by default) the debug overlay. 0 keeps every debug key inert.
DebugEnable=0
; DualShock 4: lightbar breathing with health (green, amber, danger red) and the
; gunshots on the controller speaker.
DualShock4=1
Ds4Speaker=1
Ds4Rumble=1
; Controller speaker level 0-100. The pad must be on a USB cable: over plain
; Bluetooth Windows exposes no speaker path, and a v1 pad has no USB audio.
Ds4SpeakerVolume=80
; Optional: match a differently named render endpoint (substring).
Ds4SpeakerDevice=
