version: 1.{build}
skip_tags: true
image: Visual Studio 2022
install:
- cmd: premake5.bat
build:
  project: build/d3d8-wrapper.sln
  verbosity: minimal
after_build:
- ps: .\scripts\verify-runtime.ps1
- ps: Compress-Archive -Path "$env:APPVEYOR_BUILD_FOLDER\data\*" -DestinationPath "$env:APPVEYOR_BUILD_FOLDER\d3d8.zip" -Force
artifacts:
- path: d3d8.zip
  name: d3d8
deploy:
- provider: GitHub
  release: d3d8-wrapper v$(appveyor_build_version)
  auth_token:
    secure: aCLEg3b6b9NxfLYfc/a6KRp3hJUgelndAtNXJcsKLvOULq8ZA5r64Z8PkSUI36rQ
  artifact: d3d8.zip